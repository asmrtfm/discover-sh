[workspace]
members = ["discover", "discover-*"]
resolver = "2"

[profile.release]
lto = true

[workspace.package]
version = "0.1.0"
authors = ["asmrtfm"]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# The asmrtfm fork of ast-grep (Dart and Crystal support). Fetched from git by
# default; a gitignored .cargo/config.toml patches it to a local checkout of
# the fork where one exists.
ast-grep-core = { git = "https://github.com/asmrtfm/ast-grep", branch = "main", default-features = false }
ast-grep-language = { git = "https://github.com/asmrtfm/ast-grep", branch = "main" }

ignore = "0.4.22"
serde = { version = "1.0.200", features = ["derive"] }
